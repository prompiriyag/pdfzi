name: Release

# Runs when a version tag such as v0.1.0 is pushed. It tests, builds, checks the package
# and then publishes it to PyPI. Nothing is published until Trusted Publishing is set up
# on PyPI and the "pypi" environment exists on GitHub.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Tag, package version and placeholders must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          echo "tag=$tag  pyproject=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match the version $pkg in pyproject.toml"
            exit 1
          fi
          if grep -rIn -e "YOUR-GITHUB-USER" -e "<github-user>" pyproject.toml README.md; then
            echo "::error::Replace the GitHub user placeholder first"
            exit 1
          fi
          if grep -n "](docs/" README.md; then
            echo "::error::PyPI cannot show relative images. In README.md turn ](docs/x.svg) into a full https://raw.githubusercontent.com/<user>/pdfzi/main/docs/x.svg link (the repository must be public)."
            exit 1
          fi

      - name: Build
        run: uv build

      - name: Check the package
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # Trusted Publishing: PyPI trusts this workflow, no API token is stored
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
